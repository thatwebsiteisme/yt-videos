[project]
name = "yt-videos-pipeline"
version = "1.0.0"
description = "Local YouTube video downloader, audio extractor, subtitle parser, and MLX Whisper fallback transcriber"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2025.1.0",
    "static-ffmpeg>=2.7",
    "jinja2>=3.1.0",
    "mlx-whisper>=0.4.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.1.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
